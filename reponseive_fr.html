<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE-edge">
	<meta name="viewport" content)="width=device-width, initial-scale=1.0">
	<title>Responsive login</title>
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" href="reponsive.css">
</head>

<body>
	
	<div class="container">
		<div class="form-box login">
			<form action="">
				<h1>Connexion</h1>
				<div class="input-box">
					<input type="text" placeholder="Nom d'utilisateur" required>
					<i class='bx bxs-user'></i>
				</div>
				<div class="input-box">
					<input type="password" placeholder="Mot de passe" required>
					<i class='bx bxs-lock-alt'></i>
				</div>
				<div class="forgot-link">
					<a href="#">Mot de passe oublié ?</a>
				</div>
				<button type="submit" class="btn" >Se connecter</button>
				<p> Ou se connecter avec les réseaux sociaux :</p>
				<div class="social-icons">
					<a href="#"><i class='bx bxl-google'></i></a>
					<a href="#"><i class='bx bxl-facebook' ></i></a>
					<a href="#"><i class='bx bxl-github' ></i></a>
					<a href="#"><i class='bx bxl-linkedin' ></i></a>
					<a href="#"><i class='bx bxl-apple' ></i></a>
				</div>
			</form>
		</div>	
	
		<div class="form-box register">
			<form action="">
				<h1>Création de compte</h1>
				<div class="input-box">
					<input type="text" placeholder="Nom d'utilisateur" required>
					<i class='bx bxs-user'></i>
				</div>
				<div class="input-box">
					<input type="email" placeholder="Adresse mail" required>
					<i class='bx bxs-envelope' ></i>
				</div>
				<div class="input-box">
					<input type="password" placeholder="Mot de passe" required>
					<i class='bx bxs-lock-alt'></i>
				</div>
				
				<button type="submit" class="btn" >Créer</button>
				<p>Ou créer à travers les résaeux sociaux :</p>
				<div class="social-icons">
					<a href="#"><i class='bx bxl-google'></i></a>
					<a href="#"><i class='bx bxl-facebook' ></i></a>
					<a href="#"><i class='bx bxl-github' ></i></a>
					<a href="#"><i class='bx bxl-linkedin' ></i></a>
					<a href="#"><i class='bx bxl-apple' ></i></a>
				</div>
			</form>
		</div>
		
		<div class="toggle-box">
			<div class="toggle-panel toggle-left">
				<h1>Bienvenue !</h1>
				<p>Vous n'avez pas de compte ?</p>
				<button class="btn register-btn">Créer</button>
			</div>
			<div class="toggle-panel toggle-right">
				<h1> Bienvenue !</h1>
				<p>Avez-vous déjà un compte ?</p>
				<button class="btn login-btn">Connectez-vous</button>
			</div>
		</div>
	</div>	
	
	<script src="script.js"></script>
	
</body>

</html>
